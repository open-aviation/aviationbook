crossref:
  fig-title: Figure
  tbl-title: Table
  fig-prefix: Figure
  tbl-prefix: Table
  ref-hyperlink: true

bibliography: bibliography.bib
csl: media/ieee.csl
pdf-engine: xelatex
highlight-style: pygments

format:
  html:
    theme:
      light: [flatly, media/css/light.scss]
      dark: [darkly, media/css/dark.scss]
    smooth-scroll: true
    toc: true
    code-copy: true
    css:
      - media/css/style.css
      - media/css/datalink.css
      - media/css/box.css
      - sidebar-compact.css
    template-partials:
      - media/html/title-metadata.html
    grid:
      sidebar-width: 310px
      body-width: 880px
      margin-width: 260px
  pdf:
    documentclass: scrbook
    papersize: a4
    cite-method: citeproc

filters:
  - media/lua/reviewers.lua
  - acronyms

acronyms:
  include_unused: false
  insert_links: false
  fromfile: _acronyms.yml
  insert_loa: "end"
  loa_title: ""
